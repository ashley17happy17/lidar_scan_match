# Lidar Scan Match ROS Parameters

# Bag Playback Configuration
bag_file: "/root/catkin_ws/data/data_collection/20260918_rec01/merged_sep.bag"                            # string: path to .bag file (leave "" for live subscriber mode)
bag_start_time: 150.0                     # unit: sec (start offset from bag beginning, e.g. 30.0)
bag_duration: -1.0                       # unit: sec (duration to process, -1.0 for entire bag)
exit_on_finish: false                   # bool: automatically terminate ROS node when bag finishes

lidar_topic: "/points_raw" #"/ouster/points"   #       # sensor_msgs/PointCloud2
gps_topic: "/gps/fix" #"/ublox_gps_node/fix" #        # sensor_msgs/NavSatFix
imu_topic: "/imu_combined"              # sensor_msgs/Imu

# HD Map Settings
hd_map_directory: "/root/catkin_ws/data/BaoGao_HDmap_pcd/" #/PH3_HDmap/map_tiles/" #
map_tile_size: 50.0                    # unit: meter

# Extrinsics (IMU to Lidar)
# IMU Frame: X-Front, Y-Left, Z-Up (Standard ROS Frame)
extrinsicTrans: [0.627273, 0.372772, 0.986067]         # unit: meter [x, y, z]
extrinsicRot: [ 0.999879, -0.010550, -0.011447,        # 3x3 Rotation Matrix (Row-major)
                0.010116, 0.999253, -0.037311,
                0.011832, 0.037191, 0.999238]

# Extrinsics (IMU to GPS)
extrinsicGpsTrans: [0.16, 0.64, 0.59]      # unit: meter [x, y, z]

# IMU Preintegration Parameters
# Unit: continuous time noise density
imuAccNoise: 0.005886                 # unit: m/s^2 / sqrt(Hz)
imuGyrNoise: 0.00087266               # unit: rad/s / sqrt(Hz)
imuAccBiasN: 0.00186                  # unit: m/s^2 / s / sqrt(Hz) (Random Walk)
imuGyrBiasN: 0.00007272               # unit: rad/s / s / sqrt(Hz) (Random Walk)
imuGravity: 9.81007                    # unit: m/s^2

# Point Downsample VoxelSize & Filtering
leaf_size: 0.2                          # unit: meter (Voxel Grid Size)
crop_min_bound: [2.5, 1.5, 1.0]        #unit: meter
crop_max_bound: [80.0, 80.0, 30.0]      #unit: meter

# Small-GICP
use_vgicp: true                         # Switch to false to compare with standard GICP
icp_max_iterations: 100                 # unit: count
icp_rotation_epsilon: 5e-3              # unit: rad
icp_transformation_epsilon: 1e-2        # unit: meter
icp_euclidean_fitness_epsilon: 1e-4     # unit: meter
icp_max_dist_sq: 36.0                    # unit: meter^2 (Matching search radius squared)
icp_num_threads: 15                     # unit: count
lidar_rps: 10                           # unit: Hz (Lidar sensor frequency)
hd_map_match_interval: 2                # unit: Hz (Target frequency for Scan-to-HDMap match)

# Loop Closure
loop_closure_enabled: true
loop_closure_search_radius: 15.0        # unit: meter
loop_closure_fitness_score: 0.5         # unitless (Lower is better)
loop_closure_travel_distance: 30.0      # unit: meter

# Robustness Thresholds
gps_std_thres: 5.0                      # unit: meter (Minimum GPS precision to trigger factor)
gps_cov_multiplier: 1.5                # unit: ratio (Inflate GPS noise to balance with Lidar)
icp_max_acceptable_fitness_score: 10.0   # unitless (Discard matching above this error)
max_single_frame_translation: 20.0       # unit: meter (Failsafe for IMU prediction jumps)
max_single_frame_rotation: 0.5         # Max allowed rotation per frame (rad, ~28deg)
local_match_jump_gate: 1.0              # unit: meter (Base jump gate for accepting a Local Map match)
local_match_jump_relax_step: 0.5        # unit: meter (Gate relaxes by this much per consecutive failure)
local_match_max_consecutive_failures: 5 # unit: count (Force local map refresh after this many failures)
gps_fallback_min_failures: 3            # unit: count (Inject loose-covariance GPS once local match fails this many times outside HD Map)
gps_std_thres_no_map: 5.0               # unit: meter (Trust standard-precision GPS over local-map ICP whenever outside HD Map)
no_map_use_gps_only: true              # bool: outside HD Map, skip lidar scan-to-local-map entirely and trust GPS/IMU directly
no_map_gps_fixed_std: 2.0               # unit: meter (Assumed GPS 2D std-dev used when no_map_use_gps_only is true, ignores reported covariance)

# DEBUG (test only): place raw lidar in world by GNSS position + IMU/EOP
# orientation only (no scan matching). Publishes /lidar_scan_match_c/gnss_eop_cloud,
# /gnss_eop_path, and /gnss_eop_range_rings. Set false (or delete) to restore.
debug_gnss_eop: false

# Output
out_trajectory_path: "/root/catkin_ws/data/data_collection/output/tmp/ego_traj_map.csv"
out_save: true                          # bool: whether to save CSV on exit
out_hz: 10                              # unit: Hz (Trajectory recording frequency)